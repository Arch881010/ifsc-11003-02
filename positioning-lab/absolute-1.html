<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positioning Lab</title>
  <style type="text/css">
    /* ---------------Box Sizing----------------- */
    html {
      box-sizing: border-box;
    }
    *,
    *:before,
    *:after {
      box-sizing: inherit;
    }
    body {
      background-color: #ECECEC;
      font-weight: bold;
      font-family: Tahoma, Geneva, sans-serif;
      color: #FFF;
      text-align: center;
      line-height: 24px;
    }
    #wrapper {
      background-color: #FFF;
      border: 1px solid #c0c0c0;
      width: 800px;
      margin-right: auto;
      margin-left: auto;
      text-shadow: 2px 2px #000;
    }
    #navy {
      background-color: #001f3f;
    }
    #teal {
      background-color: #39CCCC;
    }
    #blue {
      background-color: #0074D9;
    }
    #aqua {
      background-color: #7FDBFF;
    }
    #footer {
      background-color: #666;
    }
    h1 {
      color: #000;
      font-weight: normal;
      padding: 50px;
    }
  </style>
  <style type="text/css">
    h1 {
      padding: 20px;
    }

    #wrapper {
      width: 58%;
      height: 173px;
    }

    #navy {
      position: absolute;
      top: 0;
      left: 0;
      width: 110px;
      height: 110px;
    }

    #teal {
      position: absolute;
      top: 0;
      right: 0;
      width: 110px;
      height: 110px;
    }

    #blue {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 110px;
      height: 110px;
    }

    #aqua {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 110px;
      height: 110px;
    }

    #footer {
      position: absolute;
      top: 137px;
      left: 50%;
      width: 112px;
      height: 112px;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <h1>Exercise</h1>
  <section id="wrapper">
    <div id="navy">Navy</div>
    <div id="teal">Teal</div>
    <div id="blue">Blue</div>
    <div id="aqua">Aqua</div>
    <div id="footer">Footer</div>
  </section>
</body>

</html>
